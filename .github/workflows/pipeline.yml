name: Pipeline [test -> build -> deploy]

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      additional_docker_tag:
        description: Additional docker tag that can be used to specify stable or testing tags
        required: false
        default: ''
        type: string
      push:
        description: Push docker image to registry flag
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  # Only cancel in progress when on a branch - use SHA on main to ensure uniqueness.
  # This will allow multiple pipelines to run at the same time on main.
  # Note that two pipelines running within a few minutes of each other will cause issues with helm deploying to
  # a namespace, as the second one will not be able to get a lock as a deploy will be in progress.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # main node build workflow
  node_build:
    name: node build
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_build.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      install_command: 'npm run setup'
  # generic node unit tests - feel free to override with local tests if required
  node_unit_tests:
    name: node unit tests
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/node_unit_tests.yml@v2 # WORKFLOW_VERSION
    needs: [node_build]
    secrets: inherit
  # generic node integration tests using wiremock - feel free to override with local tests if required
  node_integration_tests:
    name: node integration tests
    needs: [node_build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            app_port: 3007
            wiremock_port: 9091
          - shard: 2
            app_port: 3008
            wiremock_port: 9092
          - shard: 3
            app_port: 3009
            wiremock_port: 9093
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      wiremock:
        image: wiremock/wiremock
        ports:
          - ${{ matrix.wiremock_port }}:8080
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npm run int-test-init:ci

      - name: Start application
        env:
          PORT: ${{ matrix.app_port }}
          PW_BASE_URL: http://localhost:${{ matrix.app_port }}
          HMPPS_AUTH_URL: http://localhost:${{ matrix.wiremock_port }}/auth
          TOKEN_VERIFICATION_API_URL: http://localhost:${{ matrix.wiremock_port }}/verification
          MANAGING_PRISONER_APPS_API_URL: http://localhost:${{ matrix.wiremock_port }}/managingPrisonerApps
          PRISON_API_URL: http://localhost:${{ matrix.wiremock_port }}/prison
          PERSONAL_RELATIONSHIPS_API_URL: http://localhost:${{ matrix.wiremock_port }}/personalRelationships
          DOCUMENT_API_URL: http://localhost:${{ matrix.wiremock_port }}/documentApi
          OS_PLACES_API_URL: http://localhost:${{ matrix.wiremock_port }}/osPlaces
        run: nohup npm run start-feature > "$RUNNER_TEMP/start-feature.log" 2>&1 &

      - name: Wait for application
        env:
          APP_PORT: ${{ matrix.app_port }}
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent "http://localhost:${APP_PORT}/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Application did not become ready"
          cat "$RUNNER_TEMP/start-feature.log"
          exit 1

      - name: Run integration tests
        env:
          PW_ENV: mock
          PW_BASE_URL: http://localhost:${{ matrix.app_port }}
          WIREMOCK_PORT: ${{ matrix.wiremock_port }}
        run: npm run int-test -- --shard=${{ matrix.shard }}/3
  helm_lint:
    strategy:
      matrix:
        environments: ['dev', 'preprod', 'prod']
    name: helm lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}
  build:
    name: Build docker image from hmpps-github-actions
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2 # WORKFLOW_VERSION
    needs:
      - node_integration_tests
      - node_unit_tests
    with:
      docker_registry: 'ghcr.io'
      registry_org: 'ministryofjustice'
      additional_docker_tag: ${{ inputs.additional_docker_tag }}
      push: ${{ inputs.push || inputs.push == null }}
      docker_multiplatform: false
  deploy_dev:
    name: Deploy to the development environment
    needs:
      - build
      - helm_lint
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'dev'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'false' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
  deploy_staging:
    name: Deploy to the staging environment
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - deploy_dev
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'staging'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'false' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
  deploy_preprod:
    name: Deploy to pre-production environment
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - deploy_staging
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'preprod'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'false' # if 'true', it needs a valid NONPROD_RELEASES_SLACK_CHANNEL variable to be set
  deploy_prod:
    name: Deploy to production environment
    if: github.ref == 'refs/heads/main'
    needs:
      - build
      - deploy_preprod
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_env.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: 'prod'
      app_version: '${{ needs.build.outputs.app_version }}'
      slack_notification: 'true'
